<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3f8f2">
    <title>Kutibxona · 3D App Launcher</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f8f2;
        --text: #20352a;
        --muted: #687b6e;
        --mint: #27835f;
        --gold: #c77b25;
        --violet: #7459bb;
        --panel: rgba(255, 255, 255, .9);
        --line: rgba(63, 103, 77, .14);
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(ellipse at 48% -15%, rgba(202, 231, 207, .74), transparent 48%),
          radial-gradient(ellipse at 100% 52%, rgba(216, 208, 242, .38), transparent 37%),
          radial-gradient(ellipse at 0% 85%, rgba(193, 231, 216, .42), transparent 40%),
          var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button { font: inherit; }

      .shell {
        width: min(100% - 32px, 760px);
        margin: 0 auto;
        padding: max(20px, env(safe-area-inset-top)) 0 max(28px, env(safe-area-inset-bottom));
      }

      .topbar, .brand, .profile, .card-top, .card-bottom, .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .topbar { min-height: 42px; }
      .brand { justify-content: flex-start; gap: 10px; font-size: 15px; font-weight: 750; letter-spacing: .02em; }
      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 1px solid rgba(39, 131, 95, .25);
        border-radius: 12px;
        background: linear-gradient(145deg, rgba(114, 190, 145, .2), rgba(157, 139, 255, .12));
        box-shadow: inset 0 1px rgba(255,255,255,.8), 0 8px 22px rgba(57, 91, 67, .1);
      }
      .brand-mark svg, .footer-mark svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.7;
      }

      .status {
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 99px;
        color: #587264;
        font-size: 11px;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .status::before {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin: 0 7px 1px 0;
        border-radius: 50%;
        background: var(--mint);
        box-shadow: 0 0 12px var(--mint);
        content: "";
      }

      .hero {
        position: relative;
        display: grid;
        min-height: 250px;
        align-items: center;
        grid-template-columns: minmax(0, 1fr) 190px;
        gap: 16px;
        padding: 34px 0 22px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--mint);
        font-size: 11px;
        font-weight: 750;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 470px;
        margin: 0;
        font-size: clamp(32px, 8vw, 54px);
        font-weight: 760;
        letter-spacing: -.055em;
        line-height: .98;
      }

      .hero-copy {
        max-width: 440px;
        margin: 15px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.65;
      }

      .book-orbit {
        position: relative;
        display: grid;
        width: 174px;
        aspect-ratio: 1;
        place-items: center;
        perspective: 700px;
        justify-self: center;
      }
      .orbit {
        position: absolute;
        inset: 18%;
        border: 1px solid rgba(39, 131, 95, .2);
        border-radius: 50%;
        transform: rotateX(68deg) rotateZ(-24deg);
        box-shadow: 0 0 28px rgba(39, 131, 95, .08);
      }
      .orbit::after {
        position: absolute;
        top: 50%;
        right: -4px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 15px var(--gold);
        content: "";
      }
      .orbit.orbit-two {
        inset: 5%;
        border-color: rgba(116, 89, 187, .17);
        transform: rotateX(68deg) rotateZ(50deg);
      }
      .orbit.orbit-two::after { background: var(--violet); box-shadow: 0 0 15px var(--violet); }
      .book {
        position: relative;
        z-index: 1;
        display: grid;
        width: 84px;
        height: 104px;
        place-items: center;
        border: 1px solid rgba(255,255,255,.82);
        border-radius: 12px 9px 9px 12px;
        background: linear-gradient(145deg, #b5efd0, #56b989 65%, #388d6a);
        box-shadow: 10px 15px 25px rgba(47, 93, 65, .22), inset 5px 0 rgba(255,255,255,.48), inset -5px 0 rgba(32, 90, 62, .08);
        color: #164b36;
        font-size: 34px;
        transform: rotateY(-22deg) rotateZ(-7deg);
        animation: float 5s ease-in-out infinite;
      }
      .book-mark {
        width: 30px;
        height: 30px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.6;
      }
      .book::after {
        position: absolute;
        top: 8px;
        bottom: 8px;
        left: 10px;
        width: 1px;
        background: rgba(22, 75, 54, .25);
        content: "";
      }
      @keyframes float {
        0%, 100% { transform: translateY(0) rotateY(-22deg) rotateZ(-7deg); }
        50% { transform: translateY(-8px) rotateY(-16deg) rotateZ(-4deg); }
      }

      .section-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin: 9px 0 15px;
      }
      h2 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
      .hint { margin: 0; color: var(--muted); font-size: 12px; }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 13px;
        perspective: 1200px;
      }

      .tile {
        --tilt-x: 0deg;
        --tilt-y: 0deg;
        --glow: rgba(90, 174, 122, .16);
        position: relative;
        min-height: 151px;
        padding: 16px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: linear-gradient(145deg, rgba(255, 255, 255, .97), var(--panel));
        box-shadow: 0 14px 30px rgba(57, 87, 63, .09), inset 0 1px rgba(255,255,255,.95);
        color: var(--text);
        text-align: left;
        transform: perspective(900px) rotateX(var(--tilt-y)) rotateY(var(--tilt-x));
        transform-style: preserve-3d;
        transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
        -webkit-tap-highlight-color: transparent;
        cursor: pointer;
      }
      .tile::before {
        position: absolute;
        top: -50px;
        right: -40px;
        width: 145px;
        height: 145px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--glow), transparent 70%);
        content: "";
        pointer-events: none;
        transform: translateZ(12px);
      }
      .tile::after {
        position: absolute;
        right: 16px;
        bottom: 12px;
        color: rgba(50, 87, 63, .42);
        content: "↗";
        font-size: 17px;
        transform: translateZ(20px);
      }
      .tile:hover, .tile:focus-visible {
        border-color: rgba(39, 131, 95, .38);
        box-shadow: 0 20px 38px rgba(57, 87, 63, .14), 0 0 24px var(--glow), inset 0 1px rgba(255,255,255,.98);
        outline: none;
      }
      .tile:active { transform: perspective(900px) scale(.975); }
      .tile[data-section="assistant"] { --glow: rgba(116, 89, 187, .2); }
      .tile[data-section="audio"] { --glow: rgba(226, 164, 83, .2); }
      .tile[data-section="teachers"] { --glow: rgba(151, 126, 212, .2); }
      .tile[data-section="students"] { --glow: rgba(90, 174, 122, .18); }
      .tile[data-section="resources"] { --glow: rgba(104, 151, 204, .18); }
      .tile[data-section="about"] { --glow: rgba(218, 132, 157, .16); }

      .card-top { position: relative; z-index: 1; align-items: flex-start; }
      .icon {
        --icon-edge: #cfe0d1;
        --icon-shadow: rgba(57, 91, 67, .18);
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border: 1px solid rgba(255,255,255,.94);
        border-radius: 14px;
        background: linear-gradient(145deg, #fff 4%, var(--icon-face) 100%);
        box-shadow:
          0 2px 0 rgba(255,255,255,.98),
          0 5px 0 var(--icon-edge),
          0 9px 14px var(--icon-shadow),
          inset 0 2px 3px rgba(255,255,255,.98),
          inset 0 -3px 6px rgba(49, 88, 59, .08);
        transform: translateZ(25px);
        transition: transform .2s ease, box-shadow .2s ease;
      }
      .icon svg {
        width: 25px;
        height: 25px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.85;
        filter:
          drop-shadow(0 1px 0 rgba(255,255,255,.95))
          drop-shadow(0 3px 2px var(--icon-shadow));
        transform: translateZ(8px);
      }
      .tile:hover .icon, .tile:focus-visible .icon {
        box-shadow:
          0 2px 0 rgba(255,255,255,.98),
          0 6px 0 var(--icon-edge),
          0 12px 17px var(--icon-shadow),
          inset 0 2px 3px rgba(255,255,255,.98),
          inset 0 -3px 6px rgba(49, 88, 59, .08);
        transform: translateZ(31px) scale(1.06);
      }
      .tile[data-section="books"] .icon {
        --icon-face: #e4f5e8;
        --icon-edge: #c5e1ce;
        --icon-shadow: rgba(49, 120, 78, .2);
        color: #27835f;
      }
      .tile[data-section="assistant"] .icon {
        --icon-face: #eee8fb;
        --icon-edge: #d9cef0;
        --icon-shadow: rgba(105, 81, 165, .2);
        color: #6951a5;
      }
      .tile[data-section="audio"] .icon {
        --icon-face: #fff0dc;
        --icon-edge: #f0d7b4;
        --icon-shadow: rgba(169, 104, 28, .2);
        color: #a9681c;
      }
      .tile[data-section="teachers"] .icon {
        --icon-face: #eee8fb;
        --icon-edge: #d9cef0;
        --icon-shadow: rgba(105, 81, 165, .2);
        color: #6951a5;
      }
      .tile[data-section="students"] .icon {
        --icon-face: #e3f4ed;
        --icon-edge: #c6e5d7;
        --icon-shadow: rgba(39, 131, 95, .2);
        color: #27835f;
      }
      .tile[data-section="resources"] .icon {
        --icon-face: #e7f0fb;
        --icon-edge: #cedff2;
        --icon-shadow: rgba(71, 117, 167, .2);
        color: #4775a7;
      }
      .tile[data-section="about"] .icon {
        --icon-face: #f9e9ee;
        --icon-edge: #efcfd9;
        --icon-shadow: rgba(163, 91, 113, .2);
        color: #a35b71;
      }
      .index { color: rgba(76, 105, 82, .48); font-size: 10px; letter-spacing: .12em; }
      .card-bottom {
        position: relative;
        z-index: 1;
        align-items: flex-end;
        margin-top: 21px;
        transform: translateZ(17px);
      }
      .title { display: block; margin: 0; font-size: 15px; font-weight: 720; letter-spacing: -.02em; }
      .description { display: block; margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.4; }

      .footer {
        justify-content: center;
        gap: 8px;
        margin-top: 18px;
        color: rgba(87, 111, 93, .72);
        font-size: 10px;
      }
      .footer-mark { display: inline-flex; color: var(--mint); }
      .notice {
        display: none;
        margin-top: 14px;
        padding: 11px 13px;
        border: 1px solid rgba(199, 123, 37, .28);
        border-radius: 12px;
        background: rgba(255, 239, 211, .72);
        color: #79501f;
        font-size: 12px;
      }
      .notice.visible { display: block; }
      .hidden { display: none !important; }
      .language-picker {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        background:
          radial-gradient(ellipse at 48% -15%, rgba(202, 231, 207, .74), transparent 48%),
          var(--bg);
      }
      .language-card {
        width: min(100%, 420px);
        padding: 28px 22px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 20px 50px rgba(57, 87, 63, .12);
        text-align: center;
      }
      .language-card h1 { margin: 0 0 20px; font-size: 22px; }
      .language-options { display: grid; gap: 12px; }
      .language-choice {
        display: flex;
        min-height: 56px;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: #fff;
        color: var(--text);
        cursor: pointer;
        font-size: 15px;
        font-weight: 700;
        text-align: left;
      }
      .language-choice:hover { border-color: var(--mint); }
      .language-choice span { font-size: 23px; }
      .catalog {
        margin-top: 20px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: rgba(255,255,255,.82);
        box-shadow: 0 16px 34px rgba(57, 87, 63, .09), inset 0 1px rgba(255,255,255,.95);
      }
      .catalog-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 18px 14px;
        border-bottom: 1px solid rgba(63, 103, 77, .1);
      }
      .catalog-toolbar h2 { font-size: 17px; }
      .catalog-back {
        padding: 8px 11px;
        border: 1px solid rgba(63, 103, 77, .15);
        border-radius: 999px;
        background: linear-gradient(145deg, #fff, #edf5ed);
        box-shadow: 0 3px 0 #dce9dd, 0 5px 10px rgba(57, 87, 63, .08);
        color: #355f43;
        font-size: 12px;
        font-weight: 650;
        cursor: pointer;
      }
      .catalog-list { display: grid; gap: 8px; padding: 12px; }
      .book-row {
        display: grid;
        min-height: 58px;
        align-items: center;
        grid-template-columns: 35px minmax(0, 1fr) 28px;
        gap: 11px;
        padding: 9px 12px;
        border: 1px solid rgba(63, 103, 77, .1);
        border-radius: 14px;
        background: linear-gradient(110deg, #fff, #f8fbf7);
        box-shadow: 0 3px 8px rgba(57, 87, 63, .045);
        color: var(--text);
        text-align: left;
        cursor: pointer;
        transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
      }
      .book-row:hover, .book-row:focus-visible {
        border-color: rgba(39, 131, 95, .3);
        box-shadow: 0 8px 15px rgba(57, 87, 63, .1);
        outline: none;
        transform: translateY(-2px);
      }
      .book-row-index {
        display: grid;
        width: 32px;
        height: 36px;
        place-items: center;
        border: 1px solid rgba(39, 131, 95, .15);
        border-radius: 8px 6px 6px 8px;
        background: linear-gradient(145deg, #e1f3e7, #c3e3ce);
        box-shadow: 2px 3px 0 #b5d6c0, 0 5px 8px rgba(49, 120, 78, .1), inset 2px 0 rgba(255,255,255,.7);
        color: #27835f;
        font-size: 11px;
        font-weight: 750;
      }
      .book-row-title { overflow-wrap: anywhere; font-size: 13px; font-weight: 650; line-height: 1.4; }
      .book-row-action { color: #27835f; font-size: 17px; text-align: center; }
      .catalog-message {
        margin: 0;
        padding: 22px 18px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
        text-align: center;
      }
      .assistant {
        margin-top: 20px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: rgba(255,255,255,.86);
        box-shadow: 0 16px 34px rgba(57, 87, 63, .09), inset 0 1px rgba(255,255,255,.95);
      }
      .assistant-form { display: grid; gap: 12px; padding: 16px; }
      .assistant-field { display: grid; gap: 7px; color: var(--text); font-size: 12px; font-weight: 650; }
      .assistant-field select, .assistant-field textarea {
        width: 100%;
        border: 1px solid rgba(63, 103, 77, .18);
        border-radius: 12px;
        background: #fff;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        padding: 11px 12px;
      }
      .assistant-field textarea { min-height: 100px; resize: vertical; line-height: 1.5; }
      .assistant-field select:focus, .assistant-field textarea:focus {
        border-color: var(--mint);
        outline: 2px solid rgba(39, 131, 95, .15);
      }
      .assistant-submit {
        min-height: 44px;
        border: 1px solid #27835f;
        border-radius: 12px;
        background: linear-gradient(145deg, #39a779, #27835f);
        box-shadow: 0 4px 0 #1f704f, 0 8px 14px rgba(39, 131, 95, .16);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .assistant-submit:disabled { cursor: wait; opacity: .65; }
      .assistant-note, .assistant-answer {
        margin: 0;
        padding: 12px 16px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }
      .assistant-answer {
        margin: 0 16px 16px;
        border: 1px solid rgba(63, 103, 77, .12);
        border-radius: 14px;
        background: #f8fbf7;
        color: var(--text);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      @media (max-width: 520px) {
        .shell { width: min(100% - 24px, 420px); }
        .hero { min-height: 227px; grid-template-columns: minmax(0, 1fr) 112px; gap: 4px; padding-top: 28px; }
        .book-orbit { width: 118px; }
        .book { width: 61px; height: 78px; border-radius: 9px; }
        .book-mark { width: 23px; height: 23px; }
        .hero-copy { max-width: 240px; font-size: 12px; }
        .grid { gap: 10px; }
        .tile { min-height: 142px; padding: 13px; border-radius: 17px; }
        .icon { width: 43px; height: 43px; }
        .icon svg { width: 23px; height: 23px; }
        .title { font-size: 13px; }
        .description { max-width: 130px; font-size: 10px; }
        .section-heading { align-items: flex-start; flex-direction: column; gap: 5px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="language-picker hidden" id="language-picker" aria-labelledby="language-picker-title">
        <div class="language-card">
          <h1 id="language-picker-title">Tilni tanlang / Выберите язык</h1>
          <div class="language-options">
            <button class="language-choice" type="button" data-language="uz">
              <span aria-hidden="true">🇺🇿</span> O‘zbekcha
            </button>
            <button class="language-choice" type="button" data-language="ru">
              <span aria-hidden="true">🇷🇺</span> Русский
            </button>
          </div>
        </div>
      </section>
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 6.5c-2.5-2-5.3-2.3-8-1.6v12c2.8-.8 5.5-.4 8 1.6m0-12c2.5-2 5.2-2.3 8-1.6v12c-2.8-.8-5.5-.4-8 1.6m0-12v12"/></svg>
          </span>
          <span>KUTIBXONA</span>
        </div>
        <div class="status" id="status">ONLINE</div>
      </header>

      <section class="hero" id="hero-section" aria-labelledby="welcome-title">
        <div>
          <p class="eyebrow" id="eyebrow">BILIMLAR OLAMIGA KIRISH</p>
          <h1 id="welcome-title">Kutubxonangiz,<br>yangi o‘lchamda.</h1>
          <p class="hero-copy" id="hero-copy">Kitoblar, audio va ta’limiy resurslar — barchasi bitta makonda.</p>
        </div>
        <div class="book-orbit" aria-hidden="true">
          <div class="orbit"></div><div class="orbit orbit-two"></div>
          <div class="book">
            <svg class="book-mark" viewBox="0 0 24 24"><path d="M12 19V9m0 4c0-4-2.3-6.2-6-6.5.2 4.2 2.2 6.4 6 6.5m0-1c0-3.5 2-5.5 5.7-5.8-.2 3.8-2.1 5.7-5.7 5.8"/></svg>
          </div>
        </div>
      </section>

      <section id="launcher-section" aria-labelledby="section-title">
        <div class="section-heading">
          <h2 id="section-title">Nimani izlayapsiz?</h2>
          <p class="hint" id="section-hint">Bo‘limni tanlang · Telegram’da ochiladi</p>
        </div>
        <div class="grid" id="launcher-grid"></div>
        <div class="notice" id="notice" role="status"></div>
      </section>

      <section class="catalog hidden" id="book-catalog" aria-labelledby="catalog-title">
        <div class="catalog-toolbar">
          <h2 id="catalog-title">Kitoblar</h2>
          <button class="catalog-back" id="catalog-back" type="button">← Orqaga</button>
        </div>
        <div class="catalog-list" id="catalog-list" aria-live="polite"></div>
      </section>

      <section class="assistant hidden" id="assistant-panel" aria-labelledby="assistant-title">
        <div class="catalog-toolbar">
          <h2 id="assistant-title">AI yordamchi</h2>
          <button class="catalog-back" id="assistant-back" type="button">← Orqaga</button>
        </div>
        <p class="assistant-note" id="assistant-note"></p>
        <form class="assistant-form" id="assistant-form">
          <label class="assistant-field" for="assistant-mode">
            <span id="assistant-mode-label">Yordam turi</span>
            <select id="assistant-mode" required></select>
          </label>
          <label class="assistant-field hidden" id="assistant-book-field" for="assistant-book">
            <span id="assistant-book-label">Kitob</span>
            <select id="assistant-book"></select>
          </label>
          <label class="assistant-field" for="assistant-question">
            <span id="assistant-question-label">Savol yoki istagingiz</span>
            <textarea id="assistant-question" maxlength="1200" required></textarea>
          </label>
          <button class="assistant-submit" id="assistant-submit" type="submit">So‘rash</button>
        </form>
        <p class="assistant-answer hidden" id="assistant-answer" aria-live="polite"></p>
      </section>

      <footer class="footer">
        <span class="footer-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 20v-8m0 4c0-3.8-2.2-5.8-5.8-6 .2 3.7 2.1 5.7 5.8 6m0-3c0-3.5 2-5.4 5.6-5.7-.2 3.6-2 5.5-5.6 5.7"/></svg>
        </span>
        <span>Kutubxona · O‘qing, tinglang, o‘rganing</span>
      </footer>
    </main>
    <script>
      (() => {
        const telegram = window.Telegram && window.Telegram.WebApp;
        if (telegram) {
          telegram.ready();
          telegram.expand();
          if (telegram.setHeaderColor) telegram.setHeaderColor("#f3f8f2");
          if (telegram.setBackgroundColor) telegram.setBackgroundColor("#f3f8f2");
        }

        const pageParams = new URLSearchParams(window.location.search);
        const selectedLanguage = pageParams.get("lang");
        const languageCode = ["uz", "ru"].includes(selectedLanguage)
          ? selectedLanguage
          : telegram && telegram.initDataUnsafe && telegram.initDataUnsafe.user
            ? telegram.initDataUnsafe.user.language_code
            : "uz";
        const isRussian = languageCode === "ru";
        const content = isRussian ? {
          eyebrow: "ВХОД В МИР ЗНАНИЙ",
          title: "Ваша библиотека<br>в новом измерении.",
          intro: "Книги, аудио и учебные материалы — всё в одном пространстве.",
          section: "Что вы ищете?",
          hint: "Выберите раздел · откроется в Telegram",
          footer: "Kutubxona · Читайте, слушайте, учитесь",
          missing: "Откройте приложение через кнопку меню в боте, чтобы перейти в раздел.",
          catalogTitle: "Книги",
          back: "← Назад",
          loading: "Загружаем список книг…",
          empty: "В библиотеке пока нет PDF-книг.",
          catalogUnavailable: "Откройте Mini App заново: отправьте боту /start и нажмите кнопку библиотеки.",
          catalogFailed: "Не удалось загрузить список книг. Попробуйте ещё раз.",
          assistantTitle: "AI-помощник",
          assistantNote: "Вопрос и найденные отрывки PDF передаются в Google Gemini API для ответа.",
          assistantModeLabel: "Тип помощи",
          assistantBookLabel: "Книга",
          assistantQuestionLabel: "Ваш вопрос или пожелание",
          assistantPlaceholder: "Напишите вопрос, интересы или учебную задачу…",
          assistantSubmit: "Спросить AI",
          assistantLoading: "AI готовит ответ…",
          assistantMissingApi: "AI-сервис пока не подключён к серверу библиотеки.",
          assistantMissingTelegram: "Откройте Mini App из Telegram, чтобы отправить запрос.",
          assistantBooksUnavailable: "Не удалось загрузить список книг для вопросов.",
          assistantModes: [
            ["book_qa", "Вопрос по выбранной книге"],
            ["recommend", "Рекомендация книги"],
            ["study", "Помощь ученику или учителю"],
          ],
          retry: "Повторить",
          cards: [
            ["books", "Книги", "Книги и учебная литература"],
            ["assistant", "AI-помощник", "Спросите по книге или учёбе"],
            ["audio", "Аудиокниги", "Слушайте прямо в Telegram"],
            ["teachers", "Учителям", "Методические материалы"],
            ["students", "Ученикам", "Выберите класс и предмет"],
            ["resources", "Общие ресурсы", "Материалы для всех"],
            ["about", "О библиотеке", "Откройте Kutubxona"],
          ],
        } : {
          eyebrow: "BILIMLAR OLAMIGA KIRISH",
          title: "Kutubxonangiz,<br>yangi o‘lchamda.",
          intro: "Kitoblar, audio va ta’limiy resurslar — barchasi bitta makonda.",
          section: "Nimani izlayapsiz?",
          hint: "Bo‘limni tanlang · Telegram’da ochiladi",
          footer: "Kutubxona · O‘qing, tinglang, o‘rganing",
          missing: "Bo‘limga o‘tish uchun ilovani bot menyusidagi tugma orqali oching.",
          catalogTitle: "Kitoblar",
          back: "← Orqaga",
          loading: "Kitoblar ro‘yxati yuklanmoqda…",
          empty: "Kutubxonada hozircha PDF kitoblar yo‘q.",
          catalogUnavailable: "Mini App’ni qayta oching: botga /start yuborib, kutubxona tugmasini bosing.",
          catalogFailed: "Kitoblar ro‘yxatini yuklab bo‘lmadi. Qayta urinib ko‘ring.",
          assistantTitle: "AI yordamchi",
          assistantNote: "Savol va topilgan PDF parchalari javob yaratish uchun Google Gemini API’ga uzatiladi.",
          assistantModeLabel: "Yordam turi",
          assistantBookLabel: "Kitob",
          assistantQuestionLabel: "Savol yoki istagingiz",
          assistantPlaceholder: "Savol, qiziqish yoki ta’limiy vazifani yozing…",
          assistantSubmit: "AI’dan so‘rash",
          assistantLoading: "AI javob tayyorlamoqda…",
          assistantMissingApi: "AI xizmati kutubxona serveriga hali ulanmagan.",
          assistantMissingTelegram: "So‘rov yuborish uchun Mini App’ni Telegram ichidan oching.",
          assistantBooksUnavailable: "Savol uchun kitoblar ro‘yxatini yuklab bo‘lmadi.",
          assistantModes: [
            ["book_qa", "Tanlangan kitobdan savol"],
            ["recommend", "Kitob tavsiyasi"],
            ["study", "O‘quvchi yoki o‘qituvchiga yordam"],
          ],
          retry: "Qayta urinish",
          cards: [
            ["books", "Kitoblar", "Kitoblar va darsliklar"],
            ["assistant", "AI yordamchi", "Kitob va ta’lim haqida so‘rang"],
            ["audio", "Audiokitoblar", "Telegram’da tinglang"],
            ["teachers", "O‘qituvchilar", "Metodik qo‘llanmalar"],
            ["students", "O‘quvchilar", "Sinf va fanni tanlang"],
            ["resources", "Umumiy resurslar", "Barcha uchun materiallar"],
            ["about", "Kutubxona haqida", "Kutubxonani kashf eting"],
          ],
        };

        document.documentElement.lang = isRussian ? "ru" : "uz";
        const languagePicker = document.getElementById("language-picker");
        if (!["uz", "ru"].includes(selectedLanguage)) {
          languagePicker.classList.remove("hidden");
        }
        languagePicker.addEventListener("click", (event) => {
          const button = event.target.closest("button[data-language]");
          if (!button) return;
          const url = new URL(window.location.href);
          url.searchParams.set("lang", button.dataset.language);
          window.location.replace(url.href);
        });
        document.getElementById("eyebrow").textContent = content.eyebrow;
        document.getElementById("welcome-title").innerHTML = content.title;
        document.getElementById("hero-copy").textContent = content.intro;
        document.getElementById("section-title").textContent = content.section;
        document.getElementById("section-hint").textContent = content.hint;
        document.querySelector(".footer span:last-child").textContent = content.footer;
        document.getElementById("catalog-title").textContent = content.catalogTitle;
        document.getElementById("catalog-back").textContent = content.back;
        document.getElementById("assistant-title").textContent = content.assistantTitle;
        document.getElementById("assistant-back").textContent = content.back;
        document.getElementById("assistant-note").textContent = content.assistantNote;
        document.getElementById("assistant-mode-label").textContent = content.assistantModeLabel;
        document.getElementById("assistant-book-label").textContent = content.assistantBookLabel;
        document.getElementById("assistant-question-label").textContent = content.assistantQuestionLabel;
        document.getElementById("assistant-question").placeholder = content.assistantPlaceholder;
        document.getElementById("assistant-submit").textContent = content.assistantSubmit;

        const assistantMode = document.getElementById("assistant-mode");
        content.assistantModes.forEach(([value, label]) => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = label;
          assistantMode.appendChild(option);
        });

        const icons = {
          books: '<svg viewBox="0 0 24 24"><path d="M12 7c-2.4-1.9-5.2-2.3-8-1.5v12c2.8-.8 5.6-.4 8 1.5m0-12c2.4-1.9 5.2-2.3 8-1.5v12c-2.8-.8-5.6-.4-8 1.5m0-12v12"/></svg>',
          assistant: '<svg viewBox="0 0 24 24"><path d="M12 3.5a7.5 7.5 0 0 0-7.5 7.5c0 1.7.6 3.3 1.6 4.5L5 20l4.7-1.1c.7.3 1.5.4 2.3.4a7.5 7.5 0 1 0 0-15.8z"/><path d="M9 10h.01M15 10h.01M9 14c1.7 1.4 4.3 1.4 6 0"/></svg>',
          audio: '<svg viewBox="0 0 24 24"><path d="M4.5 13v-1a7.5 7.5 0 0 1 15 0v1"/><rect x="3.5" y="12" width="4" height="7" rx="2"/><rect x="16.5" y="12" width="4" height="7" rx="2"/><path d="M20.5 18a4 4 0 0 1-4 4h-2"/></svg>',
          teachers: '<svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0m3-8h4v8h-7v-5l3-3z"/><path d="M16 16h3m-3 2h3"/></svg>',
          students: '<svg viewBox="0 0 24 24"><path d="m2.5 9 9.5-5 9.5 5-9.5 5-9.5-5z"/><path d="M6.5 11v5c3.4 2.7 7.6 2.7 11 0v-5m3.5-2v6"/></svg>',
          resources: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="1.5"/><path d="m14 10 4-4-2 6"/></svg>',
          about: '<svg viewBox="0 0 24 24"><path d="M3 20h18M5 20V9l7-5 7 5v11M9 20v-7h6v7"/><path d="M8 10h.01M12 9h.01M16 10h.01"/></svg>',
        };
        const grid = document.getElementById("launcher-grid");
        const notice = document.getElementById("notice");
        const hero = document.getElementById("hero-section");
        const launcherSection = document.getElementById("launcher-section");
        const catalog = document.getElementById("book-catalog");
        const catalogList = document.getElementById("catalog-list");
        const assistantPanel = document.getElementById("assistant-panel");
        const assistantForm = document.getElementById("assistant-form");
        const assistantBook = document.getElementById("assistant-book");
        const assistantBookField = document.getElementById("assistant-book-field");
        const assistantQuestion = document.getElementById("assistant-question");
        const assistantSubmit = document.getElementById("assistant-submit");
        const assistantAnswer = document.getElementById("assistant-answer");
        const apiUrl = new URLSearchParams(window.location.search).get("api") || "";

        function showCatalogMessage(message, retry) {
          catalogList.replaceChildren();
          const item = document.createElement(retry ? "button" : "p");
          item.className = retry ? "catalog-back" : "catalog-message";
          item.textContent = retry ? content.retry : message;
          if (retry) {
            item.type = "button";
            item.addEventListener("click", loadBookCatalog);
          }
          catalogList.appendChild(item);
        }

        function showBookCatalog() {
          hero.classList.add("hidden");
          launcherSection.classList.add("hidden");
          catalog.classList.remove("hidden");
          catalogList.replaceChildren();
          const loading = document.createElement("p");
          loading.className = "catalog-message";
          loading.textContent = content.loading;
          catalogList.appendChild(loading);
          loadBookCatalog();
        }

        function sendBookToBot(book) {
          if (!telegram || !telegram.sendData) {
            showCatalogMessage(content.missing, false);
            return;
          }
          telegram.sendData(JSON.stringify({
            action: "download_book",
            source: book.source,
            id: book.id,
          }));
        }

        async function loadBookCatalog() {
          if (!apiUrl) {
            showCatalogMessage(content.catalogUnavailable, false);
            return;
          }

          let endpoint;
          try {
            endpoint = new URL("/api/books", apiUrl);
          } catch {
            showCatalogMessage(content.catalogFailed, true);
            return;
          }
          if (endpoint.protocol !== "https:") {
            showCatalogMessage(content.catalogFailed, true);
            return;
          }

          catalogList.replaceChildren();
          const loading = document.createElement("p");
          loading.className = "catalog-message";
          loading.textContent = content.loading;
          catalogList.appendChild(loading);
          try {
            const response = await fetch(endpoint, { headers: { Accept: "application/json" } });
            if (!response.ok) throw new Error("Book catalog request failed.");
            const result = await response.json();
            if (!Array.isArray(result.books)) throw new Error("Invalid book catalog response.");
            catalogList.replaceChildren();
            if (result.books.length === 0) {
              showCatalogMessage(content.empty, false);
              return;
            }
            result.books.forEach((book, index) => {
              if (!book || typeof book.name !== "string" || typeof book.id !== "string"
                  || !["local", "drive"].includes(book.source)) return;
              const row = document.createElement("button");
              row.className = "book-row";
              row.type = "button";
              row.setAttribute("aria-label", `${book.name}. ${content.retry}`);
              const number = document.createElement("span");
              number.className = "book-row-index";
              number.textContent = String(index + 1).padStart(2, "0");
              const title = document.createElement("span");
              title.className = "book-row-title";
              title.textContent = book.name;
              const action = document.createElement("span");
              action.className = "book-row-action";
              action.setAttribute("aria-hidden", "true");
              action.textContent = "›";
              row.append(number, title, action);
              row.addEventListener("click", () => sendBookToBot(book));
              catalogList.appendChild(row);
            });
            if (!catalogList.childElementCount) showCatalogMessage(content.empty, false);
          } catch (error) {
            showCatalogMessage(content.catalogFailed, true);
          }
        }

        async function loadAssistantBooks() {
          if (assistantBook.dataset.loaded === "true") return;
          if (!apiUrl) {
            assistantBook.replaceChildren();
            assistantBook.disabled = true;
            assistantBook.dataset.loaded = "true";
            showAssistantMessage(content.assistantMissingApi);
            return;
          }

          let endpoint;
          try {
            endpoint = new URL("/api/books", apiUrl);
          } catch {
            showAssistantMessage(content.assistantBooksUnavailable);
            return;
          }
          if (endpoint.protocol !== "https:") {
            showAssistantMessage(content.assistantBooksUnavailable);
            return;
          }

          assistantBook.disabled = true;
          assistantBook.replaceChildren();
          const loading = document.createElement("option");
          loading.textContent = content.assistantLoading;
          loading.value = "";
          assistantBook.appendChild(loading);
          try {
            const response = await fetch(endpoint, { headers: { Accept: "application/json" } });
            if (!response.ok) throw new Error("Book catalog request failed.");
            const result = await response.json();
            const books = Array.isArray(result.books) ? result.books.filter((book) =>
              book && typeof book.id === "string" && typeof book.name === "string"
              && ["local", "drive"].includes(book.source)) : [];
            if (!books.length) throw new Error("Book catalog is empty.");
            assistantBook.replaceChildren();
            books.forEach((book) => {
              const option = document.createElement("option");
              option.value = JSON.stringify({ source: book.source, id: book.id });
              option.textContent = book.name;
              assistantBook.appendChild(option);
            });
            assistantBook.dataset.loaded = "true";
            assistantBook.disabled = false;
          } catch {
            assistantBook.replaceChildren();
            assistantBook.dataset.loaded = "false";
            showAssistantMessage(content.assistantBooksUnavailable);
          }
        }

        function showAssistantMessage(message) {
          assistantAnswer.textContent = message;
          assistantAnswer.classList.remove("hidden");
        }

        function showAssistant() {
          hero.classList.add("hidden");
          launcherSection.classList.add("hidden");
          catalog.classList.add("hidden");
          assistantPanel.classList.remove("hidden");
          assistantAnswer.classList.add("hidden");
          assistantBookField.classList.toggle("hidden", assistantMode.value !== "book_qa");
          if (assistantMode.value === "book_qa") loadAssistantBooks();
        }

        assistantMode.addEventListener("change", () => {
          const asksAboutBook = assistantMode.value === "book_qa";
          assistantBookField.classList.toggle("hidden", !asksAboutBook);
          if (asksAboutBook) loadAssistantBooks();
        });

        assistantForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          const question = assistantQuestion.value.trim();
          if (!question) return;
          if (!apiUrl) {
            showAssistantMessage(content.assistantMissingApi);
            return;
          }
          if (!telegram || !telegram.initData) {
            showAssistantMessage(content.assistantMissingTelegram);
            return;
          }

          let endpoint;
          let bookSelection = {};
          try {
            endpoint = new URL("/api/assistant", apiUrl);
            if (assistantMode.value === "book_qa") {
              bookSelection = JSON.parse(assistantBook.value);
            }
          } catch {
            showAssistantMessage(content.assistantBooksUnavailable);
            return;
          }
          if (endpoint.protocol !== "https:") {
            showAssistantMessage(content.assistantMissingApi);
            return;
          }

          assistantSubmit.disabled = true;
          assistantAnswer.textContent = content.assistantLoading;
          assistantAnswer.classList.remove("hidden");
          try {
            const response = await fetch(endpoint, {
              method: "POST",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json",
                "X-Telegram-Init-Data": telegram.initData,
              },
              body: JSON.stringify({
                mode: assistantMode.value,
                question,
                language: isRussian ? "ru" : "uz",
                book_source: bookSelection.source,
                book_id: bookSelection.id,
              }),
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || content.assistantBooksUnavailable);
            if (typeof result.answer !== "string" || !result.answer.trim()) {
              throw new Error(content.assistantBooksUnavailable);
            }
            showAssistantMessage(result.answer);
          } catch (error) {
            showAssistantMessage(error.message || content.assistantBooksUnavailable);
          } finally {
            assistantSubmit.disabled = false;
          }
        });

        document.getElementById("assistant-back").addEventListener("click", () => {
          assistantPanel.classList.add("hidden");
          hero.classList.remove("hidden");
          launcherSection.classList.remove("hidden");
        });

        document.getElementById("catalog-back").addEventListener("click", () => {
          catalog.classList.add("hidden");
          hero.classList.remove("hidden");
          launcherSection.classList.remove("hidden");
        });

        content.cards.forEach(([section, title, description], index) => {
          const button = document.createElement("button");
          button.className = "tile";
          button.type = "button";
          button.dataset.section = section;
          button.setAttribute("aria-label", title + ". " + description);
          button.innerHTML = `
            <span class="card-top">
              <span class="icon" aria-hidden="true">${icons[section]}</span>
              <span class="index">0${index + 1}</span>
            </span>
            <span class="card-bottom">
              <span><span class="title">${title}</span><span class="description">${description}</span></span>
            </span>`;
          button.addEventListener("click", () => {
            if (section === "books") {
              showBookCatalog();
              return;
            }
            if (section === "assistant") {
              showAssistant();
              return;
            }
            if (telegram && telegram.sendData) {
              telegram.sendData(JSON.stringify({ action: "open", section }));
            } else {
              notice.textContent = content.missing;
              notice.classList.add("visible");
            }
          });
          button.addEventListener("pointermove", (event) => {
            if (event.pointerType === "touch") return;
            const rect = button.getBoundingClientRect();
            const x = (event.clientX - rect.left) / rect.width - .5;
            const y = (event.clientY - rect.top) / rect.height - .5;
            button.style.setProperty("--tilt-x", `${x * 8}deg`);
            button.style.setProperty("--tilt-y", `${y * -8}deg`);
          });
          button.addEventListener("pointerleave", () => {
            button.style.setProperty("--tilt-x", "0deg");
            button.style.setProperty("--tilt-y", "0deg");
          });
          grid.appendChild(button);
        });
      })();
    </script>
  </body>
</html>
